[project]
name = "cad-khana"
version = "0.2.0"
description = "Agent-first assembly and test layer for build123d: compose parts into mechanisms, hold claims about them, and export, draw and render the result."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [
    { name = "cad-khana contributors" },
]
keywords = ["cad", "build123d", "3d-printing", "blender", "cycles", "render", "llm", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bd-warehouse>=0.2.0",
    "build123d>=0.8",
    "ocp-tessellate>=3.4",
    "pillow>=10",
    "pygltflib>=1.16",
    "typer>=0.12",
]

[project.optional-dependencies]
# `khana view --push`: the client that sends geometry to a listening OCP
# viewer. An extra since `khana view` writes its own page by default.
ocp = [
    "ocp-vscode>=2.7",
]
# Photo-real rendering through Blender Cycles (`cad_khana.render`). Its own
# extra because the wheel is ~700 MB; nothing outside that package imports it.
render = [
    "bpy>=5.1",
]

[project.scripts]
khana = "cad_khana.cli:main"

[project.urls]
Homepage = "https://github.com/cyberchitta/cad-khana"
Issues = "https://github.com/cyberchitta/cad-khana/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_khana"]

# The viewer page's sources: `khana view --page` builds them with bun the
# first time it is asked for a page, so an install carries no built page.
[tool.hatch.build.targets.wheel.force-include]
"viewer/build.ts" = "cad_khana/_viewer/build.ts"
"viewer/package.json" = "cad_khana/_viewer/package.json"
"viewer/bun.lock" = "cad_khana/_viewer/bun.lock"
"viewer/src" = "cad_khana/_viewer/src"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "bpy>=5.1",
    "ocp-vscode>=2.7",
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
# Code blocks in the docs are laid out for reading: aligned columns and
# per-argument comments that the formatter would undo.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, pyupgrade, bugbear,
# simplify, comprehensions — the last three are CLAUDE.md's style rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
# SIM300 flips `x == pytest.approx(y)` into a yoda condition.
ignore = ["SIM300"]

[tool.ruff.lint.isort]
# The example project's sibling module, imported last as local code.
known-local-folder = ["assembly"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
