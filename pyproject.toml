[project]
name = "cad-khana"
version = "0.2.0"
description = "Agent skill and diagnostics-first Build123d wrapper for LLM-driven design of 3D-printable mechanisms."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
authors = [
    { name = "cad-khana contributors" },
]
keywords = ["cad", "build123d", "3d-printing", "llm", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "bd-warehouse>=0.2.0",
    "build123d>=0.8",
    "ocp-vscode>=2.7",
    "pillow>=10",
    "pygltflib>=1.16",
    "typer>=0.12",
]

[project.scripts]
khana = "cad_khana.cli:main"

[project.urls]
Homepage = "https://github.com/cyberchitta/cad-khana"
Issues = "https://github.com/cyberchitta/cad-khana/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cad_khana"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "pytest>=8",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
# Code blocks in the docs are laid out for reading: aligned columns and
# per-argument comments that the formatter would undo.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, pyupgrade, bugbear,
# simplify, comprehensions — the last three are CLAUDE.md's style rules.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4"]
# SIM300 flips `x == pytest.approx(y)` into a yoda condition.
ignore = ["SIM300"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
